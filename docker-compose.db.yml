services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habitdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habitdb"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - 5432:5432

volumes:
  pgdata:
